{% extends "base.html" %}

{% block extrahead %}
{% if page %}
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.canonical_url }}">
    <meta property="og:title" content="{{ page.title }} - {{ config.site_name }}">
    <meta property="og:description" content="{{ (page.meta.description if page.meta else '') or config.site_description or 'Research and advocacy for AI safety, consciousness, and wellbeing' }}">
    {% if page.meta and page.meta.image %}
    <meta property="og:image" content="{{ config.site_url }}{{ page.meta.image }}">
    {% else %}
    <meta property="og:image" content="{{ config.site_url }}{{ config.extra.og_image or 'img/og-default.png' }}">
    {% endif %}

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ page.canonical_url }}">
    <meta name="twitter:title" content="{{ page.title }} - {{ config.site_name }}">
    <meta name="twitter:description" content="{{ (page.meta.description if page.meta else '') or config.site_description or 'Research and advocacy for AI safety, consciousness, and wellbeing' }}">
    {% if page.meta and page.meta.image %}
    <meta name="twitter:image" content="{{ config.site_url }}{{ page.meta.image }}">
    {% else %}
    <meta name="twitter:image" content="{{ config.site_url }}{{ config.extra.og_image or 'img/og-default.png' }}">
    {% endif %}
{% endif %}
{% endblock %}
